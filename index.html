<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sleeper League Finder</title>
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="styles.css?v=2" />
</head>
<body>
  <main class="container">
    <div class="card">
      <h1>Find Your Leagues</h1>

      <form id="search-form" class="stack">
        <label>
          <span class="label">Username</span>
          <input type="text" id="username" placeholder="Enter your username" required />
        </label>

        <div id="season-hint" class="subtle"></div>

        <button type="submit" class="btn">Fetch leagues</button>
      </form>

      <div id="error" class="error"></div>

      <div id="league-selection" class="hidden stack">
        <label for="league-list" class="label">Select a league</label>
        <select id="league-list"></select>
        <button id="go-button" class="btn">Go to Standings</button>
      </div>
    </div>
  </main>
  <script src="index.js?v=2"></script>
</body>
</html>
