<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sleeper League Finder</title>
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
  <link rel="stylesheet" href="styles.css?v=8" />
</head>
<body>
  <main class="container">
    <h1>Find your league</h1>
    <p class="intro" id="season-hint">Enter your Sleeper username to see your leagues.</p>

    <form id="search-form" class="stack">
      <div>
        <label class="label" for="sleeper-name">Sleeper username</label>
        <input type="text" id="sleeper-name" autocomplete="off" autocapitalize="off" spellcheck="false" data-1p-ignore data-lpignore="true" required />
      </div>
      <button type="submit" class="btn">Find leagues</button>
    </form>

    <div id="error" class="error" role="alert"></div>

    <ul id="league-list" class="leagues hidden" aria-label="Your leagues"></ul>
  </main>
  <script src="index.js?v=4"></script>
</body>
</html>
